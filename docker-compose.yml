services:
  worker-scraping-browser:
    container_name: worker-scraping-browser-${SESSION}
    restart: always

    build:
      context: ./
      dockerfile: ./Dockerfile

    volumes:
      - /home/dima/scrape_sessions/${SERVER}_${SESSION}:/app/user_data
      - /home/dima/browser_addons:/app/browser_addons:ro

    environment:
      # - PLAYWRIGHT_FIREFOX_POLICIES_JSON=/app/policies.json
      - LABELS=${LABELS}
      - PRISMA_URI=${PRISMA_URI}
      - SESSION=${SESSION}
      - PROXY_URI=${PROXY_URI}
      - MONGO_URI=${MONGO_URI}
      - HATCHET_CLIENT_TOKEN=${HATCHET_CLIENT_TOKEN}
      - HATCHET_CLIENT_TLS_STRATEGY=${HATCHET_CLIENT_TLS_STRATEGY}
      - HATCHET_CLIENT_LISTENER_V2_TIMEOUT=300
      - HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED=true
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - AWS_COVERS_BUCKET=${AWS_COVERS_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - TZ=${TZ}
      - SERVER=${SERVER}

    healthcheck:
      # Docker будет дергать этот URL изнутри контейнера
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s      # Как часто проверять (каждые 15 сек)
      timeout: 5s        # Сколько ждать ответа
      retries: 3         # Убить и перезапустить контейнер после 3 неудач подряд
      start_period: 30s  # Дать воркеру 10 секунд на запуск, прежде чем начать проверки

    logging:
      driver: gelf
      options:
        gelf-address: ${GELF_URI}
        tag: worker-scraping-browser
        labels: "server=${SERVER},SESSION=${SESSION}"
        mode: non-blocking
        max-buffer-size: 1k
